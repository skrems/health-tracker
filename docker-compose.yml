name: health-tracker

services:
  health-tracker:
    build:
      context: .
    container_name: health-tracker
    restart: unless-stopped
    ports:
      - "8095:80"
    environment:
      TZ: "America/Los_Angeles"
      DB_PATH: "/data/health-tracker.sqlite"
      PEPTIDE_DB_PATH: "/peptide-data/app.db"
    volumes:
      - ./data:/data
      - /Users/skrems/Projects/peptide-power-assistant/data:/peptide-data:ro
